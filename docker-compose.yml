services:
  pos:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/runtime/orders.sqlite
    volumes:
      # Bind mount (not a named volume) so orders.sqlite and the slip photos
      # under it (dirname(DB_PATH)/slips) are plain files on the host —
      # browsable with a SQLite viewer / file manager without `docker cp`.
      # Deliberately NOT /app/data: that path also holds store.js/expiry.js
      # baked into the image, and a bind mount would shadow them with an
      # empty host folder and crash the app.
      - ./runtime-data:/app/runtime
      - ./service-account.json:/app/service-account.json:ro
    expose:
      - "3000"

  # Terminates HTTPS with an auto-renewed Let's Encrypt cert, so PUBLIC_BASE_URL
  # (the address you give GBPrimePay for verification/webhook) is a real https://
  # URL. Requires a domain's DNS A record already pointing at this server's IP,
  # and ports 80+443 open/free on the host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pos

volumes:
  caddy-data:
  caddy-config:
